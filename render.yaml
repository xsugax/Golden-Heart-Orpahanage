services:
  - type: web
    name: golden-heart-orphanage
    runtime: docker
    region: oregon
    # Starter stays running. The free plan spins down after 15 minutes idle.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
